name: Aggiorna Notizie AI e Pubblica

on:
  schedule:
    - cron: "23 6 * * *"
    - cron: "37 12 * * *"
    - cron: "19 18 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: neura-wire-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Estrai notizie AI e aggiorna archivio
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_news.py

      - name: Salva nuove notizie e archivio nel repository
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "AI News Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Aggiornamento automatico notizie AI ($(date +'%Y-%m-%d'))"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 3
            done
            exit 1
          fi

      - name: Prepara artifact per GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
